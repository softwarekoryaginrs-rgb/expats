framework:
    messenger:
        default_bus: command.bus

        buses:
            command.bus:
                middleware:
                    - validation
                    - doctrine_transaction
            query.bus:
                middleware:
                    - validation

        transports:
            sync: 'sync://'

        # Commands and queries are intentionally not routed: unrouted messages are
        # handled synchronously in-process, so the handler result (HandledStamp)
        # comes back to the caller and middleware runs only once.
        routing:
